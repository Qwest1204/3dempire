[workspace]
members = [
    "apps/sandbox",
    "apps/neural_lab",
    "crates/editor_ui",
    "crates/engine",
    "crates/assets",
    "crates/renderer",
    "crates/scene",
    "crates/shaders",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["3dempire contributors"]
repository = "https://github.com/daniilogorodnikov/3dempire"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
glam = { version = "0.30", features = ["bytemuck"] }
gltf = "1.4"
hecs = "0.10"
image = "0.25"
log = "0.4"
notify = "8.2"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
wgpu = "27.0"
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
